<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wo ist?</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b1226;--card:#141d38;--fg:#f2f5ff;--gold:#ffc83d;--p1:#ff5a5f;--p2:#3fa2ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:3px solid var(--gold)}
#q{font-size:clamp(1.2rem,3.2vw,2.4rem);font-weight:800;letter-spacing:.02em}
#score{font-size:clamp(1.2rem,3vw,2.2rem);font-weight:800;white-space:nowrap}
#map{flex:1;min-height:0;background:#a9c8e4}
footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--card)}
#msg{flex:1;min-width:160px;font-size:clamp(1rem,2vw,1.5rem)}
button{font:inherit;font-weight:800;padding:12px 18px;border:0;border-radius:10px;background:var(--gold);color:#14162a;cursor:pointer}
button.s{background:#2c3a60;color:var(--fg)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
#pick{padding:24px;display:grid;gap:12px;max-width:420px;margin:auto}
#pick a{display:block;padding:16px;border-radius:12px;background:var(--card);color:var(--fg);text-decoration:none;font-weight:800;font-size:1.2rem;border-left:8px solid var(--gold)}
.leaflet-tooltip{font-weight:800}
</style>
</head>
<body>
<div id="app">
  <header><div id="q">Wo ist?</div><div id="score"></div></header>
  <div id="pick" hidden></div>
  <div id="map"></div>
  <footer>
    <div id="msg"></div>
    <button id="bSubmit" hidden>Tipp abgeben</button>
    <button id="bNext" hidden>Nächste Runde</button>
    <button id="bReveal" class="s" hidden>Jetzt aufdecken</button>
    <button id="bP1" class="s" hidden>+1 Rot</button>
    <button id="bP2" class="s" hidden>+1 Blau</button>
    <button id="bReset" class="s" hidden>Neustart</button>
  </footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,set,update,remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ===== 1. HIER DEINE FIREBASE-WERTE EINTRAGEN ===== */
const CONFIG = {
  apiKey: "AIzaSyBtHeKW_rkyMNRLvTxnge_MajgfD3qpzmk",
  authDomain: "wo-ist-41476.firebaseapp.com",
  databaseURL: "https://wo-ist-41476-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "wo-ist-41476",
  appId: "1:201395566109:web:b928c6bfcb14238b1cb8f4"
};

/* ===== 2. ORTE (n = Name, k = Art, lat/lng) – beliebig erweiterbar ===== */
const PLACES = [
  {n:"Lissabon",k:"Stadt",lat:38.72,lng:-9.14},{n:"Reykjavík",k:"Stadt",lat:64.15,lng:-21.94},
  {n:"Kapstadt",k:"Stadt",lat:-33.92,lng:18.42},{n:"Sydney",k:"Stadt",lat:-33.87,lng:151.21},
  {n:"Tokio",k:"Stadt",lat:35.68,lng:139.69},{n:"Rio de Janeiro",k:"Stadt",lat:-22.91,lng:-43.17},
  {n:"Vancouver",k:"Stadt",lat:49.28,lng:-123.12},{n:"Istanbul",k:"Stadt",lat:41.01,lng:28.98},
  {n:"Dubai",k:"Stadt",lat:25.20,lng:55.27},{n:"Singapur",k:"Stadt",lat:1.35,lng:103.82},
  {n:"Buenos Aires",k:"Stadt",lat:-34.60,lng:-58.38},{n:"Moskau",k:"Stadt",lat:55.76,lng:37.62},
  {n:"Kairo",k:"Stadt",lat:30.04,lng:31.24},{n:"Mumbai",k:"Stadt",lat:19.08,lng:72.88},
  {n:"Mexiko-Stadt",k:"Stadt",lat:19.43,lng:-99.13},{n:"Oslo",k:"Stadt",lat:59.91,lng:10.75},
  {n:"Nairobi",k:"Stadt",lat:-1.29,lng:36.82},{n:"Lima",k:"Stadt",lat:-12.05,lng:-77.04},
  {n:"Wellington",k:"Stadt",lat:-41.29,lng:174.78},{n:"Edinburgh",k:"Stadt",lat:55.95,lng:-3.19},
  {n:"Island",k:"Land",lat:64.96,lng:-19.02},{n:"Madagaskar",k:"Land",lat:-18.77,lng:46.87},
  {n:"Kolumbien",k:"Land",lat:4.57,lng:-74.30},{n:"Kasachstan",k:"Land",lat:48.02,lng:66.92},
  {n:"Neuseeland",k:"Land",lat:-40.90,lng:174.90},{n:"Marokko",k:"Land",lat:31.79,lng:-7.09},
  {n:"Vietnam",k:"Land",lat:14.06,lng:108.28},{n:"Peru",k:"Land",lat:-9.19,lng:-75.02},
  {n:"Norwegen",k:"Land",lat:60.47,lng:8.47},{n:"Namibia",k:"Land",lat:-22.96,lng:18.49},
  {n:"Mongolei",k:"Land",lat:46.86,lng:103.85},{n:"Chile",k:"Land",lat:-35.68,lng:-71.54}
];
const WIN_POINTS = 4; // Best of 7

/* ===== Ab hier nichts ändern nötig ===== */
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search);
const role = P.get("r") || "";                       // leiter | 1 | 2
const room = (P.get("raum") || "schlag-den-thomas-wo-ist").replace(/[^a-z0-9_-]/gi, "");
const N = {p1: P.get("n1") || "Rot", p2: P.get("n2") || "Blau"};
const me = role === "1" || role === "2" ? "p" + role : null;
const isLeiter = role === "leiter";

if (!role) {
  $("map").hidden = true; document.querySelector("footer").hidden = true;
  $("pick").hidden = false;
  const base = `?raum=${room}&n1=${encodeURIComponent(N.p1)}&n2=${encodeURIComponent(N.p2)}`;
  $("pick").innerHTML = `<a href="${base}&r=leiter">Spielleiter (großer Bildschirm)</a><a href="${base}&r=1" style="border-color:var(--p1)">Spieler ${N.p1}</a><a href="${base}&r=2" style="border-color:var(--p2)">Spieler ${N.p2}</a>`;
  throw new Error("Rolle wählen");
}
if (Object.values(CONFIG).some(v => v === "HIER")) {
  $("msg").textContent = "Firebase-Werte fehlen: oben in der Datei bei CONFIG eintragen.";
  $("q").textContent = "Einrichtung unvollständig";
  throw new Error("Config fehlt");
}

const db = getDatabase(initializeApp(CONFIG));
const sRef = ref(db, `rooms/${room}/state`), gRef = ref(db, `rooms/${room}/guess`);
let S = {}, G = {}, mine = null, lastKey = "", lastRound = -1, busy = false;

const WORLD = [[-58, -170], [80, 180]];
const map = L.map("map", {minZoom: 0, maxZoom: 7, zoomSnap: .5,
  maxBounds: [[-85, -180], [85, 180]], maxBoundsViscosity: 1});
map.fitBounds(WORLD);
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution("Kartendaten: Natural Earth");
// Länderflächen ohne Beschriftung, kostenlos aus dem Netz geladen
fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")
  .then(r => r.json())
  .then(w => {
    const fc = topojson.feature(w, w.objects.countries);
    fc.features = fc.features.filter(f => (f.properties || {}).name !== "Antarctica");
    L.geoJSON(fc, {interactive: false, style: {color: "#7d8aa3", weight: 1, fillColor: "#f1efe6", fillOpacity: 1}}).addTo(map).bringToBack();
  })
  .catch(() => { $("msg").textContent = "Karte konnte nicht geladen werden. Seite neu laden."; });
const layer = L.layerGroup().addTo(map);
const wrap = lng => ((lng + 540) % 360) - 180;
const km = (a, b) => {
  const r = x => x * Math.PI / 180, R = 6371;
  const h = Math.sin(r(b.lat - a.lat) / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(r(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const dot = (ll, c, t) => L.circleMarker(ll, {radius: 11, color: "#fff", weight: 3, fillColor: c, fillOpacity: 1})
  .bindTooltip(t, {permanent: true, direction: "top"}).addTo(layer);

onValue(sRef, s => { S = s.val() || {}; render(); });
onValue(gRef, s => { G = s.val() || {}; render(); if (isLeiter && S.phase === "guess" && G.p1 && G.p2) reveal(); });

map.on("click", e => {
  if (!me || S.phase !== "guess" || G[me]) return;
  mine = {lat: e.latlng.lat, lng: wrap(e.latlng.lng)};
  render();
});

async function nextRound() {
  const used = S.used || [];
  let pool = PLACES.map((_, i) => i).filter(i => !used.includes(i));
  if (!pool.length) pool = PLACES.map((_, i) => i);
  const i = pool[Math.floor(Math.random() * pool.length)];
  await remove(gRef);
  await update(sRef, {phase: "guess", idx: i, name: PLACES[i].n, kind: PLACES[i].k,
    used: pool.length === PLACES.length && used.length ? [i] : [...used, i],
    round: (S.round || 0) + 1, reveal: null, score: {p1: (S.score || {}).p1 || 0, p2: (S.score || {}).p2 || 0}});
}

async function reveal() {
  if (busy || S.phase !== "guess") return;
  busy = true;
  const t = PLACES[S.idx];
  const d1 = G.p1 ? km(t, G.p1) : 99999, d2 = G.p2 ? km(t, G.p2) : 99999;
  const w = d1 < d2 ? "p1" : d2 < d1 ? "p2" : "";
  const sc = {p1: (S.score || {}).p1 || 0, p2: (S.score || {}).p2 || 0};
  if (w) sc[w]++;
  await update(sRef, {phase: "reveal", score: sc, reveal: {lat: t.lat, lng: t.lng, d1: Math.round(d1), d2: Math.round(d2), w}});
  busy = false;
}

const addPoint = async w => {
  const sc = {p1: (S.score || {}).p1 || 0, p2: (S.score || {}).p2 || 0}; sc[w]++;
  await update(sRef, {score: sc});
};

function render() {
  const sc = S.score || {}, s1 = sc.p1 || 0, s2 = sc.p2 || 0, ph = S.phase || "idle", R = S.reveal;
  const over = s1 >= WIN_POINTS || s2 >= WIN_POINTS;
  $("score").innerHTML = `<span style="color:var(--p1)">${N.p1} ${s1}</span> : <span style="color:var(--p2)">${s2} ${N.p2}</span>`;
  if ((S.round || 0) !== lastRound) { lastRound = S.round || 0; mine = null; map.fitBounds(WORLD); }

  layer.clearLayers();
  let q = "Bereit?", m = "";
  const dtxt = d => d >= 99999 ? "kein Tipp" : d.toLocaleString("de-DE") + " km";
  if (ph === "idle") {
    q = "Wo ist …?";
    m = isLeiter ? "Mit „Nächste Runde“ geht’s los." : "Warte auf den Spielleiter …";
  } else if (ph === "guess") {
    q = `Wo ist ${S.name}?`;
    if (isLeiter) m = `${N.p1}: ${G.p1 ? "✓" : "…"}   ${N.p2}: ${G.p2 ? "✓" : "…"}`;
    else if (G[me]) { m = "Tipp abgegeben. Warte auf den Gegner …"; dot(G[me], me === "p1" ? "#ff5a5f" : "#3fa2ff", "Dein Tipp"); }
    else if (mine) { m = "Marker verschieben oder Tipp abgeben."; dot(mine, me === "p1" ? "#ff5a5f" : "#3fa2ff", "Dein Tipp"); }
    else m = "Tippe auf die Karte, wo du den Ort vermutest.";
  } else if (ph === "reveal" && R) {
    q = S.name;
    const pts = [[R.lat, R.lng]];
    dot([R.lat, R.lng], "#ffc83d", S.name);
    [["p1", "#ff5a5f", R.d1], ["p2", "#3fa2ff", R.d2]].forEach(([k, c, d]) => {
      if (!G[k]) return;
      dot(G[k], c, `${N[k]}: ${dtxt(d)}`);
      L.polyline([[R.lat, R.lng], [G[k].lat, G[k].lng]], {color: c, weight: 3, dashArray: "6 6"}).addTo(layer);
      pts.push([G[k].lat, G[k].lng]);
    });
    m = `${N.p1}: ${dtxt(R.d1)} · ${N.p2}: ${dtxt(R.d2)} → ${R.w ? "Punkt für " + N[R.w] : "Unentschieden"}`;
    const key = S.round + "r";
    if (key !== lastKey) { lastKey = key; map.fitBounds(pts, {padding: [60, 60], maxZoom: 6}); }
  }
  if (over) m += `   🏆 ${s1 > s2 ? N.p1 : N.p2} gewinnt!`;
  $("q").textContent = q; $("msg").textContent = m;

  $("bSubmit").hidden = !me; $("bSubmit").disabled = !(me && ph === "guess" && mine && !G[me]);
  [["bNext"], ["bReveal"], ["bP1"], ["bP2"], ["bReset"]].forEach(([b]) => $(b).hidden = !isLeiter);
  $("bNext").disabled = ph === "guess" || over;
  $("bReveal").disabled = !(ph === "guess" && (G.p1 || G.p2));
  $("bP1").textContent = `+1 ${N.p1}`; $("bP2").textContent = `+1 ${N.p2}`;
}

$("bSubmit").onclick = () => { if (mine) set(ref(db, `rooms/${room}/guess/${me}`), mine); };
$("bNext").onclick = nextRound;
$("bReveal").onclick = reveal;
$("bP1").onclick = () => addPoint("p1");
$("bP2").onclick = () => addPoint("p2");
$("bReset").onclick = () => { if (confirm("Spiel wirklich zurücksetzen?")) remove(ref(db, `rooms/${room}`)); };
render();
</script>
</body>
</html>
